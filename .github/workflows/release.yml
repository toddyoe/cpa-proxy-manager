name: release

# 打 tag（v0.2.2 这类）触发：五个平台并行构建 CGO 动态库，
# 按插件商店要求的命名打 zip，生成 checksums.txt，发布 GitHub Release，
# 并自动更新仓库根目录的 registry.json（CPA 第三方插件源）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: dll
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            ext: so
            cross: aarch64-linux-gnu
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: dylib
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            ext: dylib
            darwin-arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross toolchain (linux/arm64)
        if: matrix.cross == 'aarch64-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add MinGW to PATH (windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: echo "/c/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CC: ${{ matrix.cross && format('{0}-gcc', matrix.cross) || (matrix.goos == 'windows' && 'gcc' || (matrix.darwin-arch && format('clang -arch {0}', matrix.darwin-arch) || 'cc')) }}
        run: |
          go build -buildvcs=false -buildmode=c-shared -o "out/lib.${EXT}" .

      - name: Package
        shell: python
        env:
          GOOS_ENV: ${{ matrix.goos }}
          GOARCH_ENV: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          import hashlib, json, os, zipfile
          version = os.environ["REF_NAME"].lstrip("v")
          goos, goarch, ext = os.environ["GOOS_ENV"], os.environ["GOARCH_ENV"], os.environ["EXT"]
          lib_name = f"cpa-proxy-manager-v{version}.{ext}"
          zip_name = f"cpa-proxy-manager_{version}_{goos}_{goarch}.zip"
          os.rename(os.path.join("out", f"lib.{ext}"), os.path.join("out", lib_name))
          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write(os.path.join("out", lib_name), lib_name)
          data = open(zip_name, "rb").read()
          meta = {"goos": goos, "goarch": goarch, "zip": zip_name,
                  "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          open(f"meta-{goos}-{goarch}.json", "w").write(json.dumps(meta))
          print(json.dumps(meta))

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cpa-proxy-manager_*.zip
            meta-*.json

  publish:
    name: publish release and registry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # registry.json 要提交回 main 分支，不能停留在 tag 的分离提交上
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose checksums
        working-directory: dist
        run: sha256sum cpa-proxy-manager_*.zip > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cpa-proxy-manager_*.zip
            dist/checksums.txt

      - name: Generate registry.json
        shell: python
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          import glob, json, os
          version = os.environ["REF_NAME"].lstrip("v")
          repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/v{version}"
          metas = [json.load(open(p)) for p in glob.glob("dist/meta-*.json")]
          metas.sort(key=lambda m: (m["goos"], m["goarch"]))
          artifacts = [{"goos": m["goos"], "goarch": m["goarch"],
                        "url": f"{base}/{m['zip']}", "sha256": m["sha256"],
                        "size": m["size"]} for m in metas]
          registry = {
              "schema_version": 2,
              "plugins": [{
                  "id": "cpa-proxy-manager",
                  "name": "代理批量设置",
                  "description": "按模板与占位符批量设置、清空 CPA 凭据的代理地址",
                  "author": "codexvn",
                  "version": version,
                  "repository": f"https://github.com/{repo}",
                  "homepage": f"https://github.com/{repo}#readme",
                  "tags": ["proxy", "batch", "management"],
                  "install": {"type": "direct", "artifacts": artifacts},
              }],
          }
          open("registry.json", "w", encoding="utf-8").write(
              json.dumps(registry, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(registry["plugins"][0]["install"], ensure_ascii=False))

      - name: Commit registry.json
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: 更新插件源 registry.json 至 v${REF_NAME#v}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
